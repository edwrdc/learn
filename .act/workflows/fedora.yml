name: Fedora desktop

on:
  workflow_dispatch:

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: fedora-44-x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Require a Fedora x86_64 host
        run: |
          set -euo pipefail
          . /etc/os-release
          test "${ID:-}" = "fedora" || { echo "not Fedora (ID=${ID:-unknown})" >&2; exit 1; }
          test "$(uname -m)" = "x86_64" || { echo "not x86_64 (machine=$(uname -m))" >&2; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  package:
    name: Package Fedora x64 RPM
    needs: quality
    runs-on: fedora-44-x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Require a Fedora x86_64 host
        run: |
          set -euo pipefail
          . /etc/os-release
          test "${ID:-}" = "fedora" || { echo "not Fedora (ID=${ID:-unknown})" >&2; exit 1; }
          test "$(uname -m)" = "x86_64" || { echo "not x86_64 (machine=$(uname -m))" >&2; exit 1; }
      - name: Require RPM build, libcrypt compat, and Xvfb
        run: rpm -q rpm-build libxcrypt-compat xorg-x11-server-Xvfb
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - name: Build the payload and the RPM
        run: npm run desktop:dist
      - name: Initialize packaged providers offline (host and packaged Electron Node)
        run: |
          payload="dist/linux-unpacked/resources/server/standalone"
          runtime="dist/linux-unpacked/learnharness"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload" --runtime "$runtime"
      - name: Exercise packaged demo runtime (own Electron, no system Chrome)
        run: xvfb-run -a node scripts/smoke-demo-runtime.mjs --standalone dist/linux-unpacked/resources/server/standalone --runtime dist/linux-unpacked/learnharness --browser
      # act's host executor deletes its temp workspace at the end of the run,
      # so the installer is copied to the caller-computed absolute directory.
      - name: Copy the RPM outside the ephemeral act workspace
        run: |
          set -euo pipefail
          dest="${LH_OUTPUT_DIR:?LH_OUTPUT_DIR must be the absolute output directory}"
          shopt -s nullglob
          rpms=(dist/*.rpm)
          if (( ${#rpms[@]} != 1 )); then
            echo "expected exactly one RPM in dist/, found ${#rpms[@]}" >&2
            exit 1
          fi
          mkdir -p "$dest"
          cp "${rpms[0]}" "$dest"
          echo "copied $(basename "${rpms[0]}") to $dest"
